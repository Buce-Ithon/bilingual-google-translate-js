<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #202124;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .slider-row {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .scale-value {
      font-size: 12px;
      color: #1a73e8;
      font-weight: 500;
      cursor: pointer;
    }
    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: #1a73e8;
    }
    select {
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #dadce0;
      font-size: 12px;
    }
    .hint {
      font-size: 11px;
      color: #5f6368;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>Google 翻译双语对照</h3>
  <div class="row">
    <label for="toggle">启用双语显示</label>
    <input type="checkbox" id="toggle" />
  </div>
  <div class="row">
    <label for="styleSelect">原文样式</label>
    <select id="styleSelect">
      <option value="preserve">保留原样式</option>
      <option value="subtle">柔和淡色</option>
      <option value="card">蓝线卡片</option>
    </select>
  </div>
  <div class="row slider-row">
    <div class="slider-header">
      <label for="transScale">译文字号</label>
      <span id="scaleValue" class="scale-value" title="点击重置为 100%">100%</span>
    </div>
    <input type="range" id="transScale" min="80" max="150" step="5" value="100" />
  </div>
  <div class="hint">先正常使用 Chrome / Google 翻译网页，插件会自动在译文上方保留原文。</div>
  <script src="popup.js"></script>
</body>
</html>
